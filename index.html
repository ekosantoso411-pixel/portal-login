<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>SMART CBT - Login Portal</title>

    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        /* Pengaturan Layout Utama agar Tidak Terpotong & Presisi */
        html {
            width: 100%;
            height: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 !important;
            padding: 24px 16px !important;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #060913;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* --- ELEMEN BACKGROUND TEKNOLOGI (FIXED FULLSCREEN) --- */
        #tech-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .cyber-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00f2fe, #4facfe, transparent);
            box-shadow: 0 0 15px #00f2fe;
            opacity: 0.6;
            z-index: 1;
            animation: scan 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- KOTAK LOGIN (RESPONSIF & RESPONSIVE DESIGN) --- */
        .login-container {
            width: 100%;
            max-width: 390px;
            background: rgba(13, 22, 41, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 16px;
            padding: 34px 26px;
            box-shadow: 
                0 0 35px rgba(0, 242, 254, 0.18),
                inset 0 0 15px rgba(0, 242, 254, 0.05);
            position: relative;
            z-index: 2;
            margin: auto;
        }

        .login-container::before,
        .login-container::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: #00f2fe;
            border-style: solid;
            pointer-events: none;
        }

        .login-container::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
            border-top-left-radius: 16px;
        }

        .login-container::after {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
            border-bottom-right-radius: 16px;
        }

        .logo-box {
            width: 66px;
            height: 66px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.2) 0%, rgba(13, 22, 41, 0.8) 100%);
            border: 1px solid rgba(0, 242, 254, 0.4);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .logo-box i {
            font-size: 28px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
        }

        .title {
            text-align: center;
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .error-message {
            display: none;
            background-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i.icon-left {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 15px;
            pointer-events: none;
            transition: color 0.3s;
        }

        input {
            width: 100%;
            height: 46px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.7);
            padding: 0 42px;
            font-size: 16px;
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease-in-out;
            -webkit-appearance: none;
        }

        input::placeholder {
            color: #475569;
            font-size: 14px;
        }

        input:focus {
            border-color: #00f2fe;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        .input-group:focus-within i.icon-left {
            color: #00f2fe;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            font-size: 15px;
            padding: 8px;
            border-radius: 4px;
            transition: color 0.2s;
            touch-action: manipulation;
        }

        .toggle-password:hover {
            color: #00f2fe;
        }

        .btn-login {
            width: 100%;
            height: 46px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4);
            transition: all 0.25s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #00d2ff 0%, #0082ff 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 198, 255, 0.6);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px !important;
            }
            .login-container {
                padding: 28px 20px;
                border-radius: 14px;
            }
            .title {
                font-size: 20px;
            }
            .subtitle {
                font-size: 12px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <canvas id="tech-canvas"></canvas>
    <div class="cyber-grid"></div>
    <div class="scanline"></div>

    <main class="login-container">
        <div class="logo-box">
            <img alt="Logo Sekolah" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhxs5G5zI4pgHrPStO3xvwCShPVwMjkSLqn5bMsmPH9UDhuhs65NZZotNS35HhmsT2eDT7jRwzmi8K_yAZR79Vk_1OVl8LhyphenhyphenC2XiA7R_6gcIfIkprlo2juXnLQfv7TLWraGdA7V5hBa6kYN08ExLTFENXs5P9YdY9TRPRCarlB3EDBIz-wax1GoNeiujUX9/s1600/LOGO%20BRAND%20FIX%20PNG.png" style="border-radius: 50%; height: 90%; object-fit: contain; width: 90%;"/>
        </div>

        <h1 class="title">SMART CBT</h1>
        <p class="subtitle">Sistem Ujian Berbasis Komputer</p>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm" action="#" method="POST">
            <div class="form-group">
                <label for="username">USERNAME / NISN</label>
                <div class="input-group">
                    <i class="fa-solid fa-user icon-left" aria-hidden="true"></i>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">PASSWORD / NIS</label>
                <div class="input-group">
                    <i class="fa-solid fa-lock icon-left" aria-hidden="true"></i>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan password">
                        <i class="fa-solid fa-eye-slash" id="eyeIcon" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn" disabled>
                <span id="btnText">MEMUAT DATA...</span>
                <i class="fa-solid fa-spinner fa-spin" id="btnIcon" aria-hidden="true"></i>
            </button>
        </form>
    </main>

    <script>
        /* --- ANIMASI JARINGAN PARTIKEL DATA (CANVAS) --- */
        const canvas = document.getElementById('tech-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            particles = [];
            const particleCount = Math.min(Math.floor(window.innerWidth / 15), 70);
            
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.7,
                    vy: (Math.random() - 0.5) * 0.7,
                    radius: Math.random() * 1.8 + 1
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                let p1 = particles[i];

                p1.x += p1.vx;
                p1.y += p1.vy;

                if (p1.x < 0 || p1.x > canvas.width) p1.vx *= -1;
                if (p1.y < 0 || p1.y > canvas.height) p1.vy *= -1;

                ctx.beginPath();
                ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00f2fe';
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p1.x - p2.x;
                    let dy = p1.y - p2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 242, 254, ${1 - dist / 120})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawParticles);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        drawParticles();


        /* --- LOGIKA SISTEM LOGIN --- */

        // Data akun peserta
        let usersData = [];

        const togglePasswordBtn = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");
        const loginForm = document.getElementById("loginForm");
        const errorMessage = document.getElementById("errorMessage");

        // Elemen Tombol Login
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        // ID Spreadsheet
        const sheetId = '19tElLN5g4pE959E55tZpr6dGyg4q_bpJyYIN-iS_ZXs';
        const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        // Fungsi aman untuk mengambil nilai sel Google Sheets apa pun formatnya
        function getCellValue(cell) {
            if (!cell) return "";
            if (cell.v !== undefined && cell.v !== null) return String(cell.v).trim();
            if (cell.f !== undefined && cell.f !== null) return String(cell.f).trim();
            return "";
        }

        // Proses Fetch Data dari Google Sheets
        fetch(sheetUrl)
            .then(res => {
                if (!res.ok) throw new Error("Gagal terhubung ke server Google.");
                return res.text();
            })
            .then(text => {
                const start = text.indexOf('{');
                const end = text.lastIndexOf('}');
                
                if (start === -1 || end === -1) {
                    throw new Error("Data ditolak. Pastikan akses Google Sheet diatur ke 'Siapa saja yang memiliki link'.");
                }

                const jsonString = text.substring(start, end + 1);
                const data = JSON.parse(jsonString);
                const rows = data.table.rows;
                
                // Default Index Kolom (Jika tidak ada header)
                let cNama = 0, cUser = 1, cPass = 2, cKelas = 3;
                let startIndex = 0;

                // Fitur Cerdas: Deteksi otomatis posisi kolom dari baris pertama (Header)
                if (rows.length > 0 && rows[0].c) {
                    const firstRow = rows[0].c;
                    let isHeaderFound = false;
                    for (let j = 0; j < firstRow.length; j++) {
                        const headerVal = getCellValue(firstRow[j]).toLowerCase();
                        if (headerVal.includes('nama')) { cNama = j; isHeaderFound = true; }
                        else if (headerVal.includes('user') || headerVal.includes('nisn')) { cUser = j; isHeaderFound = true; }
                        else if ((headerVal.includes('pass') || headerVal.includes('nis')) && !headerVal.includes('nisn')) { cPass = j; isHeaderFound = true; }
                        else if (headerVal.includes('kelas')) { cKelas = j; isHeaderFound = true; }
                    }
                    if (isHeaderFound) startIndex = 1; // Lewati baris pertama saat memuat data user
                }

                // Masukkan data ke array usersData
                for (let i = startIndex; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || !row.c) continue;

                    const nama = getCellValue(row.c[cNama]);
                    const user = getCellValue(row.c[cUser]);
                    const pass = getCellValue(row.c[cPass]);
                    const kelas = getCellValue(row.c[cKelas]);
                    
                    if (user && pass) { 
                        usersData.push({ nama, user, pass, kelas });
                    }
                }
                
                console.log("Data Siswa Berhasil Dimuat:", usersData.length, "akun.");

                // Aktifkan kembali tombol login
                loginBtn.disabled = false;
                btnText.textContent = 'LOGIN';
                btnIcon.className = 'fa-solid fa-right-to-bracket';
            })
            .catch(err => {
                console.error("Error mengambil data:", err);
                errorMessage.textContent = err.message.includes("Data ditolak") 
                    ? err.message 
                    : "Gagal memuat data. Pastikan koneksi internet lancar dan Link Sheet valid.";
                errorMessage.style.display = "block";
                
                btnText.textContent = 'GAGAL MEMUAT';
                btnIcon.className = 'fa-solid fa-triangle-exclamation';
            });

        // Toggle Password Visibility
        togglePasswordBtn.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            
            eyeIcon.classList.toggle("fa-eye-slash", !isPassword);
            eyeIcon.classList.toggle("fa-eye", isPassword);
        });

        // Event Login & Redirect berdasarkan Kelas
        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            errorMessage.style.display = "none";

            // Username dibuat case-insensitive (tidak peduli huruf besar/kecil)
            const usernameInput = document.getElementById("username").value.trim().toLowerCase();
            const passwordInputValue = passwordInput.value.trim();

            const foundUser = usersData.find(
                (u) => u.user.toLowerCase() === usernameInput && u.pass === passwordInputValue
            );

            if (foundUser) {
                // Simpan nama agar bisa digunakan di halaman selanjutnya
                sessionStorage.setItem("userNama", foundUser.nama);
                
                // --- LOGIKA REDIRECT LEBIH CERDAS ---
                const userKelas = foundUser.kelas.toLowerCase();
                
                if (userKelas.includes("7") || userKelas.includes("vii")) {
                    window.location.href = "https://ekosantoso411-pixel.github.io/kelas-7/";
                } else if (userKelas.includes("8") || userKelas.includes("viii")) {
                    window.location.href = "https://ekosantoso411-pixel.github.io/kelas-8/";
                } else if (userKelas.includes("9") || userKelas.includes("ix")) {
                    window.location.href = "https://ekosantoso411-pixel.github.io/kelas-9/";
                } else {
                    // Fallback jika tidak menemukan angka kelas
                    window.location.href = "https://ekosantoso411-pixel.github.io/halaman-login/";
                }

            } else {
                errorMessage.textContent = "USERNAME ATAU PASSWORD SALAH!";
                errorMessage.style.display = "block";
                
                // Animasi getar saat gagal
                loginForm.style.animation = "shake 0.4s ease";
                setTimeout(() => { loginForm.style.animation = "none"; }, 400);
            }
        });
        
        // Menambahkan style keyframes untuk animasi shake jika login salah
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `@keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }`;
        document.head.appendChild(styleSheet);

    </script>

</body>
</html>
